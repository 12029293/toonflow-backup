worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_max_body_size 2048m;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  map $http_x_forwarded_host $real_host { default $http_x_forwarded_host; "" $host; }
  map $http_x_forwarded_proto $real_scheme { default $http_x_forwarded_proto; "" $scheme; }
  map $http_origin $effective_origin { default $http_origin; "" $real_scheme://$real_host; }

  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Metrics panel: served on the same origin so the sandbox does not need a second
    # published port. Kept out of the app's own /api namespace to avoid collisions.
    location /metrics/ {
      proxy_pass http://127.0.0.1:3003/;
      proxy_set_header Host $real_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $real_scheme;
      proxy_buffering off;
    }

    # Device-link APIs verify the caller is a local Toonflow page: they require the socket
    # to be loopback AND req.hostname to be localhost, and Origin to match `proto://host`.
    # The general rule rewrites Host to the public domain, which fails that check forever
    # (the UI polls status every 5s, producing a stream of 403s). Keep Host local for this
    # prefix so the guard sees a loopback request, and set Origin to match it.
    location /api/mobileLink/ {
      set $ml_ok 0;
      if ($http_origin = "") { set $ml_ok 1; }
      if ($http_origin = $real_scheme://$real_host) { set $ml_ok 1; }
      if ($ml_ok = 0) { return 403; }
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host 127.0.0.1:3000;
      proxy_set_header Origin http://127.0.0.1:3000;
      proxy_set_header Referer http://127.0.0.1:3000/;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host 127.0.0.1:3000;
      proxy_buffering off;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $real_host;
      proxy_set_header Origin $effective_origin;
      proxy_set_header Referer $real_scheme://$real_host/;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $real_scheme;
      proxy_set_header X-Forwarded-Host $real_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
    }
  }
}